<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regras</title>
    <link rel="stylesheet" href="../style/components/header.css">
    <link rel="stylesheet" href="../style/components/sidebar.css">
    <link rel="stylesheet" href="../style/components/modal.css">
    <link rel="stylesheet" href="../style/crud.css">
    <link rel="stylesheet" href="../style/components/toast.css">
    <link rel="icon" type="image/png" href="/assets/imgs/logoTopo.png">
    <link rel="stylesheet" href="/style/components/notificacoes.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <div id="modal-root"></div>
    <div class="toast-viewport" id="toast-viewport"></div>
    <main>
        <div class="container">
            <div class="container-title">
                <h1>Visualizar Regras de Classificação</h1>
                <div class="container-title-info">
                    Configure suas próprias <strong>regras</strong> para classificar KPIs
                </div>
            </div>

            <div class="topo-tabela">
                <button class="botao-cadastro" onclick="abrirModalCadastroRegra()">
                    <img src="/assets/icons/plus-icon.png" alt="Ícone de mais" class="img-botao-cadastro">
                    Cadastrar
                </button>
            </div>

            <table class="tabela">
                <thead>
                    <tr>
                        <th>Classificação</th>
                        <th>KPI</th>
                        <th>Descrição</th>
                        <th>Cor</th>
                        <th>Limite inferior</th>
                        <th>Limite superior</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </main>

    <script src="../components/modal/modalConfig.js"></script>
    <script src="../components/modal/modal.js"></script>
    <script src="../components/modal/modalTemplates.js"></script>
    <script src="../components/modal/regrasModalForms.js"></script>
    <script src="../components/modal/regrasModalActions.js"></script>
    <script src="/components/toast/toast.js"></script>
    <script src="../js/regras.js"></script>
    <script src="../js/validacoes.js"></script>
    <script src="/js/include.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script>
        initPage("Administrador | Regras de Classificação");
    </script>
</body>
</html>
