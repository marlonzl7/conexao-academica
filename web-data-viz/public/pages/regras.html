<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regras</title>
    <link rel="stylesheet" href="../style/components/header.css">
    <link rel="stylesheet" href="../style/components/sidebar.css">
    <link rel="stylesheet" href="../style/regras.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <main>
        <div class="container">
            <div class="container-title">
                <h1>Visualizar Regras de Classificação</h1>
                <div class="container-title-info">
                    Configure suas próprias <strong>regras</strong> para classificar KPIs
                </div>
            </div>

            <div class="topo-tabela">
                <button class="botao-cadastro" onclick="abrirModal('modal-overlay-cadastro')">
                    <img src="/assets/icons/plus-icon.png" alt="Ícone de mais" class="img-botao-cadastro">
                    Cadastrar
                </button>
            </div>

            <table class="tabela">
                <thead>
                    <tr>
                        <th>Classificação</th>
                        <th>KPI</th>
                        <th>Limite inferior</th>
                        <th>Limite superior</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </main>

    <div id="modal-overlay-cadastro" class="overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Registrar Regras</h2>
                <span class="fechar-modal" onclick="fecharModal('modal-overlay-cadastro')">X</span>
            </div>

            <input type="hidden" id="cadastro-regra-id" value="">

            <div class="modal-body">
                <div class="form-group">
                    <label>Classificação</label>
                    <select id="cadastro-classificacao">
                        <option value="0">Baixo</option>
                        <option value="1">Médio</option>
                        <option value="2">Crítico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>KPI</label>
                    <!-- adicionar referências ao banco aqui depois -->
                    <select id="cadastro-kpi">
                        <option>Risco de evasão</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Limite inferior</label>
                    <input type="text" id="cadastro-limite_inferior" placeholder="Ex: 50%">
                </div>
                <div class="form-group">
                    <label>Limite superior</label>
                    <input type="text" id="cadastro-limite_superior" placeholder="Ex: 80%">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-botao-cancelar" onclick="fecharModal('modal-overlay-cadastro')">Cancelar</button>
                <button class="modal-botao-confirmar" onclick="cadastrarRegra()">Registrar</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay-edicao" class="overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Editar Regras</h2>
                <span class="fechar-modal" onclick="fecharModal('modal-overlay-edicao')">X</span>
            </div>

            <input type="hidden" id="edicao-regra-id" value="">

            <div class="modal-body">
                <div class="form-group">
                    <label>Classificação</label>
                    <select id="edicao-classificacao">
                        <option value="0">Baixo</option>
                        <option value="1">Médio</option>
                        <option value="2">Crítico</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>KPI</label>
                    <!-- adicionar referências ao banco aqui depois -->
                    <select id="edicao-kpi">
                        <option>Risco de evasão</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Limite inferior</label>
                    <input type="text" id="edicao-limite_inferior" placeholder="Ex: 50%">
                </div>
                <div class="form-group">
                    <label>Limite superior</label>
                    <input type="text" id="edicao-limite_superior" placeholder="Ex: 80%">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-botao-cancelar" onclick="fecharModal('modal-overlay-edicao')">Cancelar</button>
                <button class="modal-botao-confirmar" onclick="atualizarRegra()">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay-delecao" class="overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Exclusão</h2>
                <span class="fechar-modal" onclick="fecharModal('modal-overlay-delecao')">X</span>
            </div>

            <input type="hidden" id="delecao-regra-id" value="">

            <div class="modal-body">
                <div class="form-group center">
                    <span>Tem certeza que deseja excluir esse registro?</span>
                </div>
            </div>
            <div class="modal-footer center">
                <button class="modal-botao-cancelar" onclick="fecharModal('modal-overlay-delecao')">Cancelar</button>
                <button class="modal-botao-deletar" onclick="deletarRegra()">Deletar</button>
            </div>
        </div>
    </div>

    <script src="../js/regras.js"></script>
    <script src="../js/validacoes.js"></script>
</body>

</body>
<script src="/js/include.js"></script>
<script>
    initPage("Administrador | Regras de Classificação");
</script>
</html>
