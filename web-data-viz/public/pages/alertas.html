<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas | Conexão Acadêmica</title>
    <link rel="stylesheet" href="/style/alertas.css">
    <link rel="stylesheet" href="/style/components/sidebar.css">
    <link rel="stylesheet" href="/style/components/header.css">
    <link rel="stylesheet" href="/style/components/modal.css">
    <link rel="stylesheet" href="/style/components/toast.css">
    <link rel="icon" type="image/png" href="/assets/imgs/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>

    <div class="toast-viewport" id="toast-viewport"></div>

    <main class="dashboard-content">

        <div class="page-header">
            <div>
                <h1 class="page-title">Alertas</h1>
                <p class="page-subtitle">Gerencie os alertas do sistema</p>
            </div>
            <button class="btn-nova-regra" onclick="abrirModalNovoAlerta()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Novo Alerta
            </button>
        </div>

        <section class="alertas-resumo">

            <div class="resumo-card resumo-card--critico">
                <div class="resumo-card-body">
                    <div>
                        <p class="resumo-card-label">Alertas Críticos</p>
                        <p class="resumo-card-valor" id="count-critico">—</p>
                        <p class="resumo-card-descricao">Requerem ação imediata</p>
                    </div>
                    <div class="resumo-card-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                            <line x1="12" y1="9" x2="12" y2="13" />
                            <line x1="12" y1="17" x2="12.01" y2="17" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="resumo-card resumo-card--atencao">
                <div class="resumo-card-body">
                    <div>
                        <p class="resumo-card-label">Atenção</p>
                        <p class="resumo-card-valor" id="count-atencao">—</p>
                        <p class="resumo-card-descricao">Monitoramento Necessário</p>
                    </div>
                    <div class="resumo-card-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="resumo-card resumo-card--ativo">
                <div class="resumo-card-body">
                    <div>
                        <p class="resumo-card-label">Total de Alertas</p>
                        <p class="resumo-card-valor" id="count-total">—</p>
                        <p class="resumo-card-descricao">Sistema de monitoramento</p>
                    </div>
                    <div class="resumo-card-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8h1a4 4 0 010 8h-1" />
                            <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z" />
                            <line x1="6" y1="1" x2="6" y2="4" />
                            <line x1="10" y1="1" x2="10" y2="4" />
                            <line x1="14" y1="1" x2="14" y2="4" />
                        </svg>
                    </div>
                </div>
            </div>

        </section>

        <section class="alertas-section">
            <div class="alertas-card">

                <div class="alertas-card-header">
                    <h2 class="alertas-card-title">Alertas Ativos</h2>
                    <div class="alertas-filtros">
                        <button class="btn-filtrar" id="btn-filtrar" onclick="toggleFiltros()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                            </svg>
                            Filtrar
                        </button>
                    </div>
                </div>

                <div class="filtros-painel hidden" id="filtros-painel">
                    <div class="filtros-grupo">
                        <label class="filtros-label">Classificação</label>
                        <select class="filtro-select" id="filtro-classificacao" onchange="renderAlertas()">
                            <option value="">Todas</option>
                            <option value="Crítico">Crítico</option>
                            <option value="Atenção">Atenção</option>
                            <option value="Normal">Normal</option>
                        </select>
                    </div>
                    <div class="filtros-grupo">
                        <label class="filtros-label">Regra / KPI</label>
                       
                        <select class="filtro-select" id="filtro-kpi" onchange="renderAlertas()">
                            <option value="">Todos</option>
                        </select>
                    </div>
                </div>

                <div class="alertas-lista" id="alertas-lista"></div>

            </div>
        </section>

        <div id="modal-root"></div>

    </main>

    <script src="../js/include.js"></script>
    <script src="/components/toast/toast.js"></script>
    <script src="../components/modal/modal.js"></script>
    <script src="../components/modal/modalConfig.js"></script>
    <script src="../components/modal/modalAlertas.js"></script>
    <script>
        initPage("Alertas");

        function toggleFiltros() {
            document.getElementById('filtros-painel').classList.toggle('hidden');
        }
    </script>
</body>

</html>
