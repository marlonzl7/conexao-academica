<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/cargos.css">
    <title>Cargos - Conexão Acadêmica</title>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="./assets/icons/logo.png" alt="Logo">
            <span>Conexão Acadêmica</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active">Feed</div>
            <div class="nav-item">Conta</div>
        </nav>
        <div class="sidebar-footer">
            <div class="nav-item">Sair</div>
        </div>
    </aside>

    <div class="main">

        <header class="topbar">
            🔔 👤
        </header>

        <section class="content">
            <h1>Visualizar Cargos</h1>
            <p>Gerencie os cargos e permissões do sistema</p>

            <div class="top-actions">
                <button class="btn" onclick="abrirModalNovo()">+ Novo Cargo</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Cargos</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCargos"></tbody>
            </table>

        </section>

    </div>

    <div id="modalNovo" class="modal">
        <div class="modal-content">
            <h2>Novo Cargo</h2>
            <input type="text" id="inputNovo" placeholder="Nome do cargo">
            <button onclick="criarCargo()">Salvar</button>
            <button onclick="fecharModal('modalNovo')">Fechar</button>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h2>Editar Cargo</h2>
            <input type="text" id="inputEditar">
            <button onclick="atualizarCargo()">Salvar</button>
            <button onclick="fecharModal('modalEditar')">Fechar</button>
        </div>
    </div>

    <div id="modalExcluir" class="modal">
        <div class="modal-content">
            <h2>Tem certeza que deseja excluir?</h2>
            <button onclick="deletarCargo()">Confirmar</button>
            <button onclick="fecharModal('modalExcluir')">Cancelar</button>
        </div>
    </div>

</body>

<script>
const API = "http://localhost:3000/cargo";
let cargoSelecionadoId = null;

async function carregarCargos() {
    let data = [];

    try {
        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("Erro na API");
        }

        data = await response.json();

    } catch (erro) {
        data = [
            { id_cargo: 1, nome: "Administrador" },
            { id_cargo: 2, nome: "Coordenador" },
            { id_cargo: 3, nome: "Diretor" }
        ];
    }

    const tabela = document.getElementById("tabelaCargos");
    tabela.innerHTML = "";

    data.forEach(cargo => {
        tabela.innerHTML += `
            <tr>
                <td>${cargo.nome}</td>
                <td>
                    <button onclick="abrirModalEditar(${cargo.id_cargo}, '${cargo.nome}')">✏️</button>
                    <button onclick="abrirModalExcluir(${cargo.id_cargo})">🗑️</button>
                </td>
            </tr>
        `;
    });
}

async function criarCargo() {
    const nome = document.getElementById("inputNovo").value;

    if (!nome) return;

    try {
        await fetch(API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome })
        });
    } catch {}

    document.getElementById("inputNovo").value = "";
    fecharModal("modalNovo");
    carregarCargos();
}

async function atualizarCargo() {
    const nome = document.getElementById("inputEditar").value;

    if (!nome) return;

    try {
        await fetch(`${API}/${cargoSelecionadoId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome })
        });
    } catch {}

    fecharModal("modalEditar");
    carregarCargos();
}

async function deletarCargo() {
    try {
        await fetch(`${API}/${cargoSelecionadoId}`, {
            method: "DELETE"
        });
    } catch {}

    fecharModal("modalExcluir");
    carregarCargos();
}

function abrirModalNovo() {
    document.getElementById("modalNovo").style.display = "flex";
}

function abrirModalEditar(id, nome) {
    cargoSelecionadoId = id;
    document.getElementById("inputEditar").value = nome;
    document.getElementById("modalEditar").style.display = "flex";
}

function abrirModalExcluir(id) {
    cargoSelecionadoId = id;
    document.getElementById("modalExcluir").style.display = "flex";
}

function fecharModal(id) {
    document.getElementById(id).style.display = "none";
}

window.onload = carregarCargos;
</script>

</html>
