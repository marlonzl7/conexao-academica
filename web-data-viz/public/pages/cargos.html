<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/crud.css">
    <link rel="stylesheet" href="/style/components/header.css">
    <link rel="stylesheet" href="/style/components/sidebar.css">
    <link rel="stylesheet" href="/style/components/modal.css">
    <link rel="stylesheet" href="/style/components/toast.css">
    <link rel="stylesheet" href="/style/components/paginacao.css">
    <link rel="icon" type="image/png" href="/assets/imgs/logoTopo.png">

    <title>Conexão Acadêmica | Cargos</title>
    <link rel="stylesheet" href="/style/components/notificacoes.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>

    <div class="toast-viewport" id="toast-viewport"></div>

    <main>
        <div class="container">
            <div class="container-title">
                <h1>Visualizar Cargos</h1>
                <div class="container-title-info">
                    Gerencie os cargos e permissões do sistema
                </div>
            </div>

            <div class="topo-tabela">
                <button type="button" class="botao-cadastro" onclick="abrirModalNovoCargo()">
                    <img src="/assets/icons/plus-icon.png" alt="Ícone de mais" class="img-botao-cadastro">
                    Novo Cargo
                </button>
            </div>

            <table class="tabela">
                <thead>
                    <tr>
                        <th>Cargos</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCargos"></tbody>
            </table>
            <div class="paginacao" id="paginacao"></div>
        </div>
    </main>

    <div id="modal-root"></div>

    <script src="/components/modal/modalConfig.js"></script>
    <script src="/components/modal/modal.js"></script>
    <script src="/components/modal/modalTemplates.js"></script>
    <script src="/components/modal/cargosModalForms.js"></script>
    <script src="/components/modal/cargosModalActions.js"></script>

    <script src="/js/include.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script src="/components/toast/toast.js"></script>
    <script src="/js/cargos.js"></script>
    <script>
        initPage("Cargos");
    </script>

</body>

</html>
