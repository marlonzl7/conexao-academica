<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../style/cargos.css">
    <title>Cargos - Conexão Acadêmica</title>


</head>

<body>

   
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="./assets/icons/logo.png" alt="Logo">
            <span>Conexão Acadêmica</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item active">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                Feed
            </div>
            <div class="nav-item">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                </svg>
                Conta
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="nav-item">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Sair
            </div>
        </div>
    </aside>

    <div class="main">


        <header class="topbar">
            🔔 👤
        </header>

        <section class="content">
            <h1>Visualizar Cargos</h1>
            <p>Gerencie os cargos e permissões do sistema</p>

            <div class="top-actions">
                <button class="btn" onclick="abrirModalNovo()">+ Novo Cargo</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Cargos</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Administrador</td>
                        <td>
                            <div class="actions">
                                <button class="btn-icon" onclick="abrirModalEditar()"> ✏️ </button>

                                <button class="btn-icon" onclick="abrirModalExcluir()">
                                    🗑️
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>Coordenador</td>
                        <td>
                            <button class="btn-icon" onclick="abrirModalEditar()">✏️</button>
                            <button class="btn-icon" onclick="abrirModalExcluir()">🗑️</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Diretor</td>
                        <td>
                            <button class="btn-icon" onclick="abrirModalEditar()">✏️</button>
                            <button class="btn-icon" onclick="abrirModalExcluir()">🗑️</button>
                        </td>
                    </tr>
                </tbody>
            </table>

        </section>

    </div>

    </div>

    <div id="modalNovo" class="modal">
        <div class="modal-content">
            <h2>Novo Cargo</h2>
            <input type="text" placeholder="Nome do cargo">
            <button onclick="fecharModal('modalNovo')">Fechar</button>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h2>Editar Cargo</h2>
            <input type="text" value="Administrador">
            <button onclick="fecharModal('modalEditar')">Fechar</button>
        </div>
    </div>

    <div id="modalExcluir" class="modal">
        <div class="modal-content">
            <h2>Tem certeza que deseja excluir?</h2>
            <button>Confirmar</button>
            <button onclick="fecharModal('modalExcluir')">Cancelar</button>
        </div>
    </div>

</body>
<script>

    function abrirModalNovo() {
        document.getElementById("modalNovo").style.display = "flex";
    }

    function abrirModalEditar() {
        document.getElementById("modalEditar").style.display = "flex";
    }

    function abrirModalExcluir() {
        document.getElementById("modalExcluir").style.display = "flex";
    }

    function fecharModal(id) {
        document.getElementById(id).style.display = "none";
    }

</script>

</html>
