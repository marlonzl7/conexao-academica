<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Detalhes</title>
    <link rel="stylesheet" href="../../style/administradores/administradorDetalhes.css">
    <link rel="stylesheet" href="../../style/components/sidebar.css">
    <link rel="stylesheet" href="../../style/components/modal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Public+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Incluindo o sidebar -->
    <div id="sidebar-container"></div>

    <main class="container">
        <header class="header-nav">
            <a href="javascript:history.back()" class="btn-voltar">
                <span>&larr;</span> Voltar
            </a>
        </header>

        <section class="titulo-sessao">
            <div class="info-texto">
                <h1 id="nome_instituicao"></h1>
            </div>
            <div class="acoes-topo">
                <button class="btn-adicionar" onclick="abrirModalDiretor()">
                    <span class="plus-icon">+</span>Adicionar Diretor
                </button>

                <button class="btn-adicionar" onclick="abrirModalCoordenador()">
                    <span class="plus-icon">+</span>Adicionar Coordenador
                </button>
            </div>
        </section>

        <hr class="divider">

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-shield.svg" alt="Icone Diretor" class="icon-cat">
                <h2>Diretores</h2>
            </div>

            <div id="card_diretor">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-administrador.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Administradores</h2>
            </div>

            <div id="card_administrador">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-user.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Coordenador</h2>
            </div>

            <div id="card_coordenador">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>

    </main>
    
    <div id="modal-root"></div>

    <script src="../../components/modal/modalConfig.js"></script>
    <script src="../../components/modal/modal.js"></script>
    <script src="../../components/modal/modalForms.js"></script>
    <script src="../../components/modal/modalTemplates.js"></script>
    <script src="../../components/modal/modalActions.js"></script>

    <script src="../../js/administradores/administradorDetalhes.js"></script>

    <script src="../../js/include.js"></script>
    <script>
        initPage("Administrador | Detalhes");
    </script>
</body>

</html>
