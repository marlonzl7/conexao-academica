<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Detalhes</title>
    <link rel="stylesheet" href="../../style/administradores/administradorDetalhes.css">
    <link rel="stylesheet" href="../../style/components/header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Public+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="header-container"></div>

    <main class="container">
        <header class="header-nav">
            <a href="javascript:history.back()" class="btn-voltar">
                <span>&larr;</span> Voltar
            </a>
        </header>

        <section class="titulo-sessao">
            <div class="info-texto">
                <h1 id="nome_instituicao"></h1>
            </div>

            <div class="acoes-topo">
                <button class="btn-adicionar" onclick="abrirModal('modal-overlay-cadastro-admin')">
                    <span class="plus-icon">+</span>Adicionar Administrador
                </button>
            </div>

        </section>

        <hr class="divider">

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-shield.svg" alt="Icone Diretor" class="icon-cat">
                <h2>Diretores</h2>
            </div>

            <div id="card_diretor"></div><!-- ← removida classe pessoa-card -->

        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-administrador.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Administradores</h2>
            </div>

            <div id="card_administrador"></div><!-- ← removida classe pessoa-card -->

        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-user.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Coordenadores</h2>
            </div>

            <div id="card_coordenador"></div><!-- ← removida classe pessoa-card -->

        </section>

        <div id="modal-overlay-cadastro-diretor" class="overlay hidden">
            <div class="modal">

                <div class="modal-header">
                    <h2>Cadastrar Diretor</h2>
                    <span class="fechar-modal" onclick="fecharModal('modal-overlay-cadastro-diretor')">X</span>
                </div>

                <div class="modal-body">

                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="diretor_nome" placeholder="Ex: Carlos">
                    </div>

                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="diretor_cpf" placeholder="Ex: 19480967540">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="diretor_email" placeholder="Ex: carlos@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="diretor_senha" placeholder="Ex: cT202#R">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="modal-botao-cancelar"
                        onclick="fecharModal('modal-overlay-cadastro-diretor')">Cancelar</button>
                    <button class="modal-botao-confirmar" onclick="cadastrarDiretor()">Cadastrar</button>
                </div>

            </div>
        </div>

        <div id="modal-overlay-cadastro-admin" class="overlay hidden">
            <div class="modal">

                <div class="modal-header">
                    <h2>Cadastrar Administrador</h2>
                    <span class="fechar-modal" onclick="fecharModal('modal-overlay-cadastro-admin')">X</span>
                </div>

                <div class="modal-body">

                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="admin_nome" placeholder="Ex: Carlos">
                    </div>

                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" id="admin_cpf" placeholder="Ex: 19480967540">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="admin_email" placeholder="Ex: carlos@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="admin_senha" placeholder="Ex: cT202#R">
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="modal-botao-cancelar"
                        onclick="fecharModal('modal-overlay-cadastro-admin')">Cancelar</button>
                    <button class="modal-botao-confirmar" onclick="cadastrarAdministrador()">Cadastrar</button>
                </div>

            </div>
        </div>
    </main>
    <script src="../../js/administradores/administradorDetalhesConexao.js"></script>
    <script src="../../js/include.js"></script>
    <script>
        initPage("Administrador | Detalhes");
    </script>
</body>

</html>
