<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Detalhes</title>
    <link rel="stylesheet" href="../../style/administradores/administradorDetalhes.css">
    <link rel="stylesheet" href="../../style/components/header.css">
    <link rel="stylesheet" href="../../style/components/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Public+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-left">
        </div>

        <div class="header-right">
            <a href="#" class="link-item">
                <img src="../../assets/icons/notification-icon-fill.svg" alt="Ícone Notificação" id="notification-icon">
            </a>

            <a href="#" class="link-item">
                <span>Username</span>
                <img src="../../assets/icons/account-icon-fill.svg" alt="Ícone Usuário">
            </a>
        </div>
    </header>

    <aside class="sidebar">
        <header class="sidebar-header">
            <img src="../../assets/icons/logo.png" alt="Logo">
            <span>Conexão Acadêmica</span>
        </header>

        <nav class="sidebar-main">

            <a href="/pages/administradorInstituicao.html" class="link-box">
                <img src="../../assets/icons/planner-icon.svg" alt="Ícone Painel">
                <span>Painel</span>
            </a>

            <a href="/pages/conta.html" class="link-box">
                <img src="../../assets/icons/person-icon.svg" alt="Ícone Conta">
                <span>Conta</span>
            </a>

        </nav>

        <footer class="sidebar-footer">
            <img src="../../assets/icons/logout-icon.svg" alt="Logout">
            <span>Sair</span>
        </footer>
    </aside>

    <main class="container">
        <header class="header-nav">
            <a href="javascript:history.back()" class="btn-voltar">
                <span>&larr;</span> Voltar
            </a>
        </header>

        <section class="titulo-sessao">
            <div class="info-texto">
                <h1 id="nome_instituicao"></h1>
            </div>
            <button class="btn-adicionar">
                <span class="plus-icon">+</span> Adicionar Administrador
            </button>
        </section>

        <hr class="divider">

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-shield.svg" alt="Icone Diretor" class="icon-cat">
                <h2>Diretores</h2>
            </div>

            <div class="pessoa-card" id="card_diretor">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-administrador.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Administradores</h2>
            </div>

            <div class="pessoa-card" id="card_administrador">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../../assets/icons/icon-user.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Coordenadores</h2>
            </div>

            <div class="pessoa-card" id="card_coordenador">
                <!-- Exemplo de card de pessoa -->
            </div>
        </section>
    </main>
    <script src="../../js/administradores/administradorDetalhesConexao.js"></script>
</body>

</html>
