<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Instituição</title>
    <link rel="stylesheet" href="../../style/administradores/administradorInstituicao.css">
    <link rel="stylesheet" href="../../style/components/header.css">
    <link rel="stylesheet" href="../../style/components/sidebar.css">
    <link rel="icon" type="image/png" href="../../assets/imgs/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Public+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-left">
        </div>

        <div class="header-right">
            <a href="#" class="link-item">
                <img src="../../assets/icons/notification-icon-fill.svg" alt="Ícone Notificação" id="notification-icon">
            </a>

            <a href="#" class="link-item">
                <span>Username</span>
                <img src="../../assets/icons/account-icon-fill.svg" alt="Ícone Usuário">
            </a>
        </div>
    </header>

    <aside class="sidebar">
        <header class="sidebar-header">
            <img src="../../assets/icons/logo.png" alt="Logo">
            <span>Conexão Acadêmica</span>
        </header>

        <nav class="sidebar-main">

            <a href="/pages/administradorInstituicao.html" class="link-box">
                <img src="../../assets/icons/planner-icon.svg" alt="Ícone Painel">
                <span>Painel</span>
            </a>

            <a href="/pages/conta.html" class="link-box">
                <img src="../../assets/icons/person-icon.svg" alt="Ícone Conta">
                <span>Conta</span>
            </a>

        </nav>

        <footer class="sidebar-footer">
            <img src="../../assets/icons/logout-icon.svg" alt="Logout">
            <span>Sair</span>
        </footer>
    </aside>

    <main class="content-wrapper">
        <div class="main-container">
            <section class="titulo-pagina">
                <h1>Instituições</h1>
                <p>Gerencie sua instituição</p>
            </section>

            <section class="kpi-section">
                <div class="kpi-card">
                    <div class="icon-box blue"><img src="../../assets/icons/icon-user.svg" alt="Ícone Usuário"></div>
                    <span class="kpi-value">4</span>
                    <span class="kpi-label">Total de Pessoas</span>
                </div>
                <div class="kpi-card">
                    <div class="icon-box green"><img src="../../assets/icons/icon-shield.svg" alt="Ícone Escudo"></div>
                    <span class="kpi-value">4</span>
                    <span class="kpi-label">Pessoas Ativas</span>
                </div>
                <div class="kpi-card">
                    <div class="icon-box purple"><img src="../../assets/icons/icon-director.svg" alt="Ícone Diretor"></div>
                    <span class="kpi-value">4</span>
                    <span class="kpi-label">Diretores</span>
                </div>
            </section>

            <section class="lista-section">
                <div class="instituicao-card">
                    <div class="inst-info">
                        <div class="inst-logo-placeholder">
                            <img src="../../assets/icons/icon-predio.svg" alt="Icone Instituição">
                        </div>
                        <div class="inst-text">
                            <h3>Nome da Instituição</h3>
                            <p>Descrição da Instituição</p>
                        </div>
                    </div>
                    <a href="./administradorDetalhes.html" class="btn-acessar">Acessar &rarr;</a>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
