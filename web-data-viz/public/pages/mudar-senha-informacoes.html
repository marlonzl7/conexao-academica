<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/components/sidebar.css">
    <link rel="stylesheet" href="/style/components/header.css">
    <link rel="stylesheet" href="/style/dashboard-exemplo.css">
    <link rel="stylesheet" href="/style/informacoes.css">
    <link rel="stylesheet" href="../style/components/toast.css">
    <link rel="icon" type="image/png" href="/assets/imgs/logoTopo.png">
    <title>Conta</title>
    <link rel="stylesheet" href="/style/components/notificacoes.css">
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <div class="toast-viewport" id="toast-viewport"></div>

    <main class="main-content">
        <div class="container">
            <section class="card">
                <div class="card-header">
                    <h2>Segurança - Alterar Senha</h2>
                </div>
                <form class="card-content">
                    <div class="info-row-edit">
                        <label for="senha-atual">Senha Atual</label>
                        <input type="password" id="senhaAtual" placeholder="Senha atual"
                            placeholder="Digite sua senha atual" required>
                    </div>

                    <div class="info-row-edit">
                        <label for="nova-senha">Nova Senha</label>
                        <input type="password" id="novaSenha" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="info-row-edit">
                        <label for="confirmar-senha">Confirmar Nova Senha</label>
                        <input type="password" id="confirmarSenha" placeholder="Repita a nova senha" required>
                    </div>

                    <p id="mensagem" class="mensagem"></p>

                    <div class="actions">
                        <button type="button" class="btn-primary" onclick="alterarSenha()">Atualizar Senha</button>
                        <a href="informacoes-da-conta.html" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </main>


    </main>


    <script src="/js/include.js"></script>
    <script src="/js/notificacoes.js"></script>
    <script src="/js/informacoes.js"></script>
    <script src="../components/toast/toast.js"></script>
    <script src="/js/login.js"></script>
    <script>
        initPage("Informações da Conta");
    </script>
</body>

</html>
