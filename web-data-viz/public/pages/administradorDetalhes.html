<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Detalhes</title>
    <link rel="stylesheet" href="../style/administradorDetalhes.css">
    <link rel="stylesheet" href="../style/components/header.css">
    <link rel="stylesheet" href="../style/components/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Public+Sans:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-left">
        </div>

        <div class="header-right">
            <a href="#" class="link-item">
                <img src="../assets/icons/notification-icon-fill.svg" alt="Ícone Notificação" id="notification-icon">
            </a>

            <a href="#" class="link-item">
                <span>Username</span>
                <img src="../assets/icons/account-icon-fill.svg" alt="Ícone Usuário">
            </a>
        </div>
    </header>

    <aside class="sidebar">
        <header class="sidebar-header">
            <img src="../assets/icons/logo.png" alt="Logo">
            <span>Conexão Acadêmica</span>
        </header>

        <nav class="sidebar-main">

            <a href="/pages/administradorInstituicao.html" class="link-box">
                <img src="../assets/icons/planner-icon.svg" alt="Ícone Painel">
                <span>Painel</span>
            </a>

            <a href="/pages/conta.html" class="link-box">
                <img src="../assets/icons/person-icon.svg" alt="Ícone Conta">
                <span>Conta</span>
            </a>

        </nav>

        <footer class="sidebar-footer">
            <img src="../assets/icons/logout-icon.svg" alt="Logout">
            <span>Sair</span>
        </footer>
    </aside>

    <main class="container">
        <header class="header-nav">
            <a href="javascript:history.back()" class="btn-voltar">
                <span>&larr;</span> Voltar
            </a>
        </header>

        <section class="titulo-sessao">
            <div class="info-texto">
                <h1>Nome Instituição</h1>
                <p>Descrição Instituição</p>
            </div>
            <button class="btn-adicionar">
                <span class="plus-icon">+</span> Adicionar Pessoa
            </button>
        </section>

        <hr class="divider">

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../assets/icons/icon-shield.svg" alt="Icone Diretor" class="icon-cat">
                <h2>Diretores</h2>
            </div>

            <div class="pessoa-card">
                <div class="pessoa-info">
                    <div class="avatar-box blue">
                        <img src="../assets/icons/icon-shield.svg" alt="Icone Diretor">
                    </div>
                    <div class="pessoa-detalhes">
                        <h3>Maria Silva</h3>
                        <p class="email">Maria@gmail.com</p>
                        <div class="badges">
                            <span class="badge blue">Diretor</span>
                            <span class="permissao">Permissões Totais</span>
                        </div>
                    </div>
                </div>
                <div class="status-toggle">
                    <span>Ativo</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <section class="categoria">
            <div class="categoria-titulo">
                <img src="../assets/icons/icon-user.svg" alt="Icone Usuário" class="icon-cat">
                <h2>Coordenador</h2>
            </div>

            <div class="pessoa-card">
                <div class="pessoa-info">
                    <div class="avatar-box purple">
                        <img src="../assets/icons/icon-user.svg" alt="Icone Usuário">
                    </div>
                    <div class="pessoa-detalhes">
                        <h3>Maria Silva</h3>
                        <p class="email">Maria@gmail.com</p>
                        <div class="badges">
                            <span class="badge purple">Coordenador</span>
                            <span class="permissao">Permissões Limitadas</span>
                        </div>
                    </div>
                </div>
                <div class="status-toggle">
                    <span>Inativo</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
