<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/components/sidebar.css">
    <link rel="stylesheet" href="/style/components/header.css">
    <link rel="stylesheet" href="/style/dashboard-exemplo.css">
    <link rel="stylesheet" href="/style/informacoes.css">
    <title>Conta</title>
</head>

<body>
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <main class="main-content">

        <div class="container">
            <section class="card">
                <div class="card-header">
                    <h2>Dados cadastrados: </h2>
                </div>
                <div class="card-content">
                    <div class="info-row">
                        <p><strong>Instituição:</strong> <span id="instituicao"></span></p>
                    </div>
                    <div class="info-row">
                        <p><strong>CPF:</strong> <span id="cpf"></span></p>
                    </div>
                    <div class="info-row">
                        <p><strong>Nome:</strong> <span id="nome"></span></p>
                    </div>
                    <div class="info-row">
                        <p><strong>E-mail:</strong> <span id="email"></span></p>
                    </div>
                    <a href="editar-informacoes.html"><button class="btn-primary">Editar informações</button></a>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>Segurança</h2>
                </div>
                <div class="card-content">
                    <p><strong>Senha:</strong> ********</p>

                    <a href="mudar-senha-informacoes.html"><button class="btn-primary">Mudar senha</button></a>
                </div>

            </section>
               <div class="card-content">
                    <button class="btn-apagar" onclick="confirmarExclusao()">Excluir Minha Conta</button>
                </div>
            </section>
        </div>


    </main>


    <script src="/js/include.js"></script>
    <script src="/js/informacoes.js"></script>
    <script>
        initPage("Informações da Conta");
    </script>
</body>

</html>
